<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Visitas do portfólio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231A2433'/%3E%3Ctext x='16' y='21.5' font-family='Arial,sans-serif' font-weight='700' font-size='14' text-anchor='middle' fill='%23F2F4F3'%3ECN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Literata:opsz,wght@7..72,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="painel.css">
<script src="painel.js" defer></script>
</head>
<body>

<header class="topo">
  <a class="marca" href="./">Caio Nathan</a>
  <button class="botao-texto" id="trocar-chave" type="button" hidden>Trocar chave</button>
</header>

<main class="painel">

  <form class="chave" id="form-chave" hidden>
    <h1 class="painel-titulo">Visitas do portfólio</h1>
    <p>Digite a chave do painel para ver as visitas.</p>
    <label class="rotulo" for="campo-chave">Chave do painel</label>
    <input class="campo" id="campo-chave" name="chave" type="password" autocomplete="current-password" required>
    <button class="botao" type="submit">Ver visitas</button>
    <p class="erro" id="erro-chave" role="alert"></p>
  </form>

  <p class="aviso" id="carregando" hidden>Carregando as visitas…</p>

  <div class="falha" id="falha" hidden>
    <p class="erro" role="alert">Não foi possível falar com o contador. Tente de novo em instantes.</p>
    <button class="botao botao-linha" id="tentar-de-novo" type="button">Tentar de novo</button>
  </div>

  <section id="dados" hidden aria-labelledby="total">
    <div class="cabeca">
      <h1 class="total" id="total"></h1>
      <div class="periodo" role="group" aria-label="Período">
        <button type="button" data-dias="7" aria-pressed="false">7 dias</button>
        <button type="button" data-dias="30" aria-pressed="true">30 dias</button>
        <button type="button" data-dias="90" aria-pressed="false">90 dias</button>
      </div>
    </div>

    <p class="aviso" id="vazio" hidden>Nenhuma visita neste período.</p>

    <div id="conteudo-dados">
      <figure class="grafico">
        <figcaption class="grafico-titulo">Visitas por dia</figcaption>
        <div class="area" id="grafico-dia"></div>
        <details class="tabela">
          <summary>Ver como tabela</summary>
          <table><thead><tr><th scope="col">Dia</th><th scope="col">Visitas</th></tr></thead><tbody id="tabela-dia"></tbody></table>
        </details>
      </figure>

      <figure class="grafico">
        <figcaption class="grafico-titulo">Visitas por hora do dia <span class="grafico-nota">horário de Brasília</span></figcaption>
        <div class="area" id="grafico-hora"></div>
        <details class="tabela">
          <summary>Ver como tabela</summary>
          <table><thead><tr><th scope="col">Hora</th><th scope="col">Visitas</th></tr></thead><tbody id="tabela-hora"></tbody></table>
        </details>
      </figure>

      <div class="listas">
        <section aria-labelledby="t-origens">
          <h2 class="grafico-titulo" id="t-origens">De onde vieram</h2>
          <ol class="ranking" id="origens"></ol>
        </section>
        <section aria-labelledby="t-paises">
          <h2 class="grafico-titulo" id="t-paises">Países</h2>
          <ol class="ranking" id="paises"></ol>
        </section>
      </div>
    </div>
  </section>

</main>

<div class="dica" id="dica" role="tooltip" hidden><strong></strong><span></span></div>

</body>
</html>
